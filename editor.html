<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Editor — Novelku</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ── EDITOR LAYOUT ── */
    body { overflow: hidden; margin: 0; }
    .editor-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* Top bar row 1 — judul, status, simpan */
    .ed-row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      height: 52px;
      min-height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-width: 0;
      flex-shrink: 0;
    }
    .ed-title {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--text);
      outline: none;
      padding: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ed-status-sel {
      flex-shrink: 0;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .ed-save-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .ed-save-indicator .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .ed-save-indicator .dot.saved   { background: #5a9e6f; }
    .ed-save-indicator .dot.unsaved { background: #d4a853; }

    /* Top bar row 2 — toolbar + aksi */
    .ed-row2 {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: 38px;
      min-height: 38px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ed-toolbar {
      display: flex;
      gap: 2px;
      align-items: center;
      padding-right: 10px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tb-btn {
      width: 28px; height: 28px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      background: transparent;
      border: none;
      transition: all 0.15s;
    }
    .tb-btn:hover { background: var(--border); color: var(--text); }
    .ed-actions { display: flex; gap: 6px; margin-left: auto; align-items: center; }
    .ed-focus-btn { opacity: 0.5; transition: opacity 0.2s; }
    .ed-focus-btn:hover { opacity: 1; }

    /* Goal progress bar */
    .ed-goal-bar {
      height: 2px;
      min-height: 2px;
      background: var(--border);
      flex-shrink: 0;
    }
    .ed-goal-progress {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }

    /* Writing area — takes all remaining space */
    .ed-area {
      flex: 1;
      min-height: 0;   /* critical for flex child to shrink */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ed-textarea {
      flex: 1;
      min-height: 0;
      resize: none;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: var(--font-size);
      line-height: 1.9;
      padding: 32px 48px;
      width: 100%;
      max-width: 740px;
      align-self: center;
      outline: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      caret-color: var(--accent);
      box-sizing: border-box;
    }

    /* Footer — stats + goal */
    .ed-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 38px;
    }
    .ed-stats { display: flex; gap: 14px; flex-wrap: wrap; }
    .ed-goal  { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .ed-goal input {
      width: 68px;
      padding: 2px 8px;
      font-size: 12px;
      text-align: right;
    }

    /* Focus mode */
    .focus-mode .ed-row1,
    .focus-mode .ed-row2,
    .focus-mode .ed-footer { opacity: 0; pointer-events: none; }
    .ed-row1, .ed-row2, .ed-footer { transition: opacity 0.3s; }

    /* Draft panel */
    .draft-panel {
      position: fixed;
      top: 0; right: -380px;
      width: 360px; height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 300;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }
    .draft-panel.open { right: 0; }
    .draft-panel-hd {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .draft-panel-hd h3 { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; }
    .draft-panel-body { flex: 1; overflow-y: auto; padding: 14px; }
    .draft-item {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .draft-item:hover { border-color: var(--accent); }
    .draft-item-label { font-size: 14px; font-weight: 500; }
    .draft-item-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .draft-item-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .draft-item-actions { display: flex; gap: 6px; margin-top: 8px; }

    /* Responsive ≤ 600px */
    @media (max-width: 600px) {
      .ed-row1 { height: 48px; padding: 0 10px; gap: 6px; }
      .ed-row2 { height: 36px; padding: 0 10px; gap: 4px; }
      .ed-title { font-size: 15px; }
      .ed-status-sel { font-size: 11px; padding: 3px 5px; }
      .ed-save-label { display: none; }   /* sembunyikan teks, hanya dot */
      .ed-textarea { padding: 24px 16px; font-size: 16px; }
      .ed-footer { padding: 5px 10px; font-size: 11px; }
      .ed-stat-chars { display: none; }
      .draft-panel { width: 100%; right: -100%; }
      .ed-actions .btn { font-size: 11px; padding: 3px 8px; }
    }
  </style>
</head>
<body>
<div class="editor-shell" id="editor-shell">

  <!-- Row 1: navigasi + judul + status + simpan -->
  <div class="ed-row1">
    <button class="btn-icon" id="btn-back" title="Kembali">&larr;</button>
    <input class="ed-title" id="ed-title" placeholder="Judul bab..."/>
    <select class="ed-status-sel" id="ed-status">
      <option value="draft">Draft</option>
      <option value="revisi">Revisi</option>
      <option value="final">Final</option>
    </select>
    <div class="ed-save-indicator">
      <span class="dot" id="save-dot"></span>
      <span class="ed-save-label" id="save-label">Tersimpan</span>
    </div>
    <button class="btn btn-primary" id="btn-save" style="padding:6px 14px;font-size:13px;flex-shrink:0">Simpan</button>
    <button class="btn-icon" id="btn-settings-ed" title="Tampilan">&#9881;</button>
  </div>

  <!-- Row 2: toolbar format + aksi draft -->
  <div class="ed-row2">
    <div class="ed-toolbar">
      <button class="tb-btn" title="Bold"    onclick="fmt('**','**')"><b>B</b></button>
      <button class="tb-btn" title="Italic"  onclick="fmt('_','_')"><i>I</i></button>
      <button class="tb-btn" title="Kutipan" onclick="fmtLine('> ')">&ldquo;</button>
      <button class="tb-btn" title="Paragraf baru" onclick="insertBreak()">P+</button>
    </div>
    <div class="ed-actions">
      <button class="btn btn-ghost" id="btn-new-draft"  style="font-size:12px;padding:4px 10px">+ Versi</button>
      <button class="btn btn-ghost" id="btn-show-drafts" style="font-size:12px;padding:4px 10px">Riwayat</button>
      <button class="btn-icon ed-focus-btn" id="btn-focus" title="Focus mode">[ ]</button>
    </div>
  </div>

  <!-- Goal bar -->
  <div class="ed-goal-bar"><div class="ed-goal-progress" id="goal-bar"></div></div>

  <!-- Textarea -->
  <div class="ed-area">
    <textarea class="ed-textarea" id="ed-textarea"
      placeholder="Mulai menulis di sini...&#10;&#10;Ctrl+S = simpan  ·  F11 = Focus Mode"></textarea>
  </div>

  <!-- Footer: statistik + target -->
  <div class="ed-footer">
    <div class="ed-stats">
      <span><b id="s-words">0</b> kata</span>
      <span>~<b id="s-read">0</b> menit</span>
      <span class="ed-stat-chars"><b id="s-chars">0</b> karakter</span>
    </div>
    <div class="ed-goal">
      <span>Target:</span>
      <input type="number" id="ed-goal-input" placeholder="1000" min="0"/>
      <span>kata</span>
    </div>
  </div>
</div>

<!-- Draft versions panel -->
<div class="draft-panel" id="draft-panel">
  <div class="draft-panel-hd">
    <h3>Riwayat Versi</h3>
    <button class="btn-icon" id="btn-close-drafts">&#10005;</button>
  </div>
  <div class="draft-panel-body">
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
      Snapshot tulisan sebelum revisi besar. Maks 10 versi.
    </p>
    <div id="draft-list"></div>
  </div>
</div>

<!-- Modal: label versi -->
<div class="modal-overlay" style="display:none" id="modal-draft">
  <div class="modal" style="max-width:380px">
    <h2 class="modal-title">Simpan Versi</h2>
    <div class="form-group">
      <label>Label</label>
      <input type="text" id="draft-label" placeholder="mis. Draft awal, Sebelum revisi besar..."/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancel-draft">Batal</button>
      <button class="btn btn-primary" id="btn-confirm-draft">Simpan</button>
    </div>
  </div>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settings-panel">
  <div class="settings-title">Tampilan <button class="btn-icon" id="btn-close-settings">&#10005;</button></div>
  <div class="setting-group"><span class="setting-label">Tema</span>
    <div class="theme-options">
      <div class="theme-swatch" data-theme="dark"   style="background:linear-gradient(135deg,#0f0f13,#c9a96e)"><span>Dark</span></div>
      <div class="theme-swatch" data-theme="light"  style="background:linear-gradient(135deg,#f5f0e8,#8b5e3c)"><span>Light</span></div>
      <div class="theme-swatch" data-theme="sepia"  style="background:linear-gradient(135deg,#1a1208,#d4a853)"><span>Sepia</span></div>
      <div class="theme-swatch" data-theme="forest" style="background:linear-gradient(135deg,#0a120e,#5a9e6f)"><span>Forest</span></div>
      <div class="theme-swatch" data-theme="ocean"  style="background:linear-gradient(135deg,#080f1a,#4a90d9)"><span>Ocean</span></div>
    </div>
  </div>
  <div class="setting-group"><span class="setting-label">Font</span>
    <div class="font-options">
      <div class="font-opt" data-font="serif">Lora — Klasik</div>
      <div class="font-opt" data-font="elegant">Cormorant — Elegan</div>
      <div class="font-opt" data-font="classic">Playfair — Bergaya</div>
      <div class="font-opt" data-font="sans">DM Sans — Modern</div>
      <div class="font-opt" data-font="mono">Mono — Retro</div>
    </div>
  </div>
  <div class="setting-group"><span class="setting-label">Ukuran Font</span>
    <div class="size-control">
      <input type="range" id="font-size-range" min="14" max="28" value="18"/>
      <span class="size-val" id="font-size-val">18px</span>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="app.js"></script>
<script>
/* ── init ── */
const params   = new URLSearchParams(location.search);
const NOVEL_ID = params.get('novelId');
const CH_ID    = params.get('chapterId');
if (!NOVEL_ID || !CH_ID) { location.href = 'index.html'; }

function freshChapter() {
  const n = DB.getNovel(NOVEL_ID);
  return n ? (n.chapters || []).find(c => c.id === CH_ID) : null;
}

// validate
(function() {
  if (!DB.getNovel(NOVEL_ID) || !freshChapter()) location.href = 'chapters.html?id=' + NOVEL_ID;
})();

const ta        = document.getElementById('ed-textarea');
const titleInp  = document.getElementById('ed-title');
const saveDot   = document.getElementById('save-dot');
const saveLabel = document.getElementById('save-label');
let saveTimer = null, dirty = false, focusMode = false, wordGoal = 0;

function init() {
  const n  = DB.getNovel(NOVEL_ID);
  const ch = freshChapter();
  document.title = ch.title + ' \u2014 ' + n.title;
  titleInp.value = ch.title || '';
  ta.value       = ch.content || '';
  document.getElementById('ed-status').value = ch.status || 'draft';
  const sg = localStorage.getItem('goal_' + CH_ID);
  if (sg) { document.getElementById('ed-goal-input').value = sg; wordGoal = parseInt(sg) || 0; }
  updateStats();
  markSaved();
  wireSettingsPanel('settings-panel', 'btn-close-settings');
  renderDraftList();
}

function markDirty() {
  dirty = true;
  saveDot.className = 'dot unsaved';
  saveLabel.textContent = 'Belum tersimpan';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1500);
}
function markSaved() {
  dirty = false;
  saveDot.className = 'dot saved';
  saveLabel.textContent = 'Tersimpan';
}

function saveNow() {
  const ch = freshChapter();
  if (!ch) return;
  ch.title     = titleInp.value.trim() || 'Tanpa Judul';
  ch.content   = ta.value;
  ch.status    = document.getElementById('ed-status').value;
  ch.updatedAt = Date.now();
  DB.saveChapter(NOVEL_ID, ch);
  markSaved();
}

function updateStats() {
  const w = wordCount(ta.value);
  document.getElementById('s-words').textContent = w.toLocaleString('id-ID');
  document.getElementById('s-read').textContent  = Math.ceil(w / 200);
  document.getElementById('s-chars').textContent = ta.value.length.toLocaleString('id-ID');
  document.getElementById('goal-bar').style.width =
    wordGoal > 0 ? Math.min(100, (w / wordGoal) * 100) + '%' : '0%';
}

/* ── format helpers ── */
function fmt(before, after) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.setRangeText(before + (ta.value.substring(s, e) || 'teks') + after, s, e, 'select');
  ta.focus(); markDirty();
}
function fmtLine(prefix) {
  const s = ta.selectionStart;
  const lines = ta.value.split('\n');
  let pos = 0, li = 0;
  for (let i = 0; i < lines.length; i++) {
    if (pos + lines[i].length >= s) { li = i; break; }
    pos += lines[i].length + 1;
  }
  lines[li] = prefix + lines[li];
  ta.value = lines.join('\n');
  markDirty(); updateStats();
}
function insertBreak() {
  const p = ta.selectionStart;
  ta.value = ta.value.substring(0, p) + '\n\n' + ta.value.substring(p);
  ta.selectionStart = ta.selectionEnd = p + 2;
  ta.focus(); markDirty(); updateStats();
}
function toggleFocus() {
  focusMode = !focusMode;
  document.getElementById('editor-shell').classList.toggle('focus-mode', focusMode);
  document.getElementById('btn-focus').textContent = focusMode ? '[x]' : '[ ]';
}

/* ── draft versions ── */
function renderDraftList() {
  const ch = freshChapter();
  const drafts = ch ? (ch.drafts || []) : [];
  const el = document.getElementById('draft-list');
  if (!drafts.length) {
    el.innerHTML = '<p style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0">Belum ada versi tersimpan.</p>';
    return;
  }
  el.innerHTML = drafts.map(d =>
    '<div class="draft-item">' +
      '<div class="draft-item-label">' + d.label + '</div>' +
      '<div class="draft-item-meta">' + formatDateTime(d.savedAt) + ' &middot; ' + wordCount(d.content) + ' kata</div>' +
      '<div class="draft-item-preview">' + (d.content || '').slice(0, 180) + (d.content && d.content.length > 180 ? '...' : '') + '</div>' +
      '<div class="draft-item-actions">' +
        '<button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="restoreDraft(\'' + d.id + '\')">Pulihkan</button>' +
        '<button class="btn btn-danger" style="font-size:11px;padding:4px 10px" onclick="deleteDraft(\'' + d.id + '\')">Hapus</button>' +
      '</div>' +
    '</div>'
  ).join('');
}

function openNewDraft() {
  document.getElementById('draft-label').value = '';
  document.getElementById('modal-draft').classList.add('open');
  setTimeout(() => document.getElementById('draft-label').focus(), 100);
}
function closeDraftModal() { document.getElementById('modal-draft').classList.remove('open'); }
function confirmSaveDraft() {
  const label = document.getElementById('draft-label').value.trim() ||
    'Versi ' + new Date().toLocaleString('id-ID');
  DB.saveDraft(NOVEL_ID, CH_ID, { id: genId(), label, content: ta.value, savedAt: Date.now() });
  closeDraftModal(); renderDraftList(); toast('Versi disimpan!', 'success');
}
function restoreDraft(id) {
  const ch = freshChapter();
  const d = (ch.drafts || []).find(x => x.id === id);
  if (!d || !confirm('Pulihkan versi ini? Tulisan saat ini akan digantikan.')) return;
  ta.value = d.content; updateStats(); markDirty(); toast('Versi dipulihkan!', 'success');
}
function deleteDraft(id) {
  if (!confirm('Hapus versi ini?')) return;
  DB.deleteDraft(NOVEL_ID, CH_ID, id); renderDraftList(); toast('Versi dihapus', 'success');
}

/* ── bindings ── */
ta.addEventListener('input', () => { updateStats(); markDirty(); });
titleInp.addEventListener('input', markDirty);
document.getElementById('ed-status').addEventListener('change', markDirty);
document.getElementById('btn-save').addEventListener('click', () => { saveNow(); toast('Tersimpan!', 'success'); });
document.getElementById('btn-back').addEventListener('click', () => { if (dirty) saveNow(); location.href = 'chapters.html?id=' + NOVEL_ID; });
document.getElementById('btn-focus').addEventListener('click', toggleFocus);
document.getElementById('btn-new-draft').addEventListener('click', openNewDraft);
document.getElementById('btn-show-drafts').addEventListener('click', () => { renderDraftList(); document.getElementById('draft-panel').classList.add('open'); });
document.getElementById('btn-close-drafts').addEventListener('click', () => document.getElementById('draft-panel').classList.remove('open'));
document.getElementById('btn-cancel-draft').addEventListener('click', closeDraftModal);
document.getElementById('btn-confirm-draft').addEventListener('click', confirmSaveDraft);
document.getElementById('btn-settings-ed').addEventListener('click', () => document.getElementById('settings-panel').classList.add('open'));
document.getElementById('modal-draft').addEventListener('click', e => { if (e.target === e.currentTarget) closeDraftModal(); });
document.getElementById('ed-goal-input').addEventListener('input', function() {
  wordGoal = parseInt(this.value) || 0;
  localStorage.setItem('goal_' + CH_ID, this.value);
  updateStats();
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNow(); toast('Tersimpan!', 'success'); }
  if (e.key === 'F11') { e.preventDefault(); toggleFocus(); }
  if (e.key === 'Escape') {
    if (focusMode) toggleFocus();
    closeDraftModal();
    document.getElementById('draft-panel').classList.remove('open');
    document.getElementById('settings-panel').classList.remove('open');
  }
});
window.addEventListener('beforeunload', () => { if (dirty) saveNow(); });

init();
</script>
</body>
</html>
